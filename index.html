<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bông hoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
}

.hover-animation {
  animation: hover 1.75s ease-in-out infinite;
}

#castle {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(#293c4d, #001920);
  overflow: hidden;
}

#castle #table {
  position: absolute;
  left: calc(50% - 200px);
  top: calc(50% - 50px);
  width: 400px;
  height: 400px;
  background: radial-gradient(#a3727e, #af7279, #a16674);
  border-radius: 100%;
  border-bottom: 80px solid #623c53;
  transform: scaleY(0.225);
}

#castle .shade-wrap {
  position: absolute;
  left: calc(50% - 100px);
  top: calc(52% - 250px);
  width: 200px;
  height: 400px;
}

/* ---------- Chao den ---------- */
#shade-main {
  position: absolute;
  left: 20px;
  top: 100px;
  width: 160px;
  height: 300px;
  border-top: 1px solid rgba(255, 255, 255, 0.5);
  border-left: 1px solid rgba(255, 255, 255, 0.5);
  border-right: 1px solid rgba(255, 255, 255, 0.6);
  border-top-left-radius: 50% 30%;
  border-top-right-radius: 50% 30%;
  border-bottom: none;
  transform: perspective(200px) rotateX(8deg) scale(1.075, 1);
}

#shade-handle-big {
  position: absolute;
  left: 55px;
  top: -14px;
  width: 50px;
  height: 30px;
  border-radius: 100%;
  border-top: 1px solid rgba(255, 255, 255, 0.7);
  transform: scaleY(0.9);
}

#shade-handle-small {
  position: absolute;
  left: 70px;
  top: -33px;
  width: 20px;
  height: 20px;
  border-radius: 100%;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-bottom: none;
}

#bottom-shade {
  position: absolute;
  bottom: -20px;
  width: 100%;
  height: 40px;
  transform: scaleY(0.5);
  border-radius: 100%;
  background: radial-gradient(#d287a5, #da9db6, #985e74);
  animation: floatAnimate 1.75s ease-in-out infinite;
}

#shade-main-reflections {
  position: relative;
  left: 20px;
  top: 100px;
  width: 160px;
  height: 300px;
  border-top-left-radius: 50% 30%;
  border-top-right-radius: 50% 30%;
  border-bottom: none;
  background-color: #6d6179;
  transform: perspective(200px) rotateX(8deg) scale(1.075, 1);
  opacity: 0.15;
}

#shade-main-reflections:after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-top-right-radius: 50% 30%;
  border-right: 20px solid rgba(255, 255, 255, 0.5);
  transform: scale(0.7, 0.85);
  filter: blur(5px);
}

#shade-main-reflections:before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-top-left-radius: 50% 30%;
  border-left: 8px solid rgba(255, 255, 255, 0.6);
  transform: scale(0.85, 0.85);
  filter: blur(5px);
}

/* ---------- Hoa ---------- */
#flower-wrap {
  position: relative;
  top: -50px;
}

#stem {
  position: absolute;
  left: 82px;
  top: 187px;
  width: 100px;
  height: 150px;
  background-color: transparent;
  border: solid 4px #a1b965;
  border-color: transparent transparent transparent #a1b965;
  border-radius: 50%/120px 100px 0 0;
  transform: rotate(-3deg) scale(1.1, 0.9);
}

#petal1 {
  position: absolute;
  left: 97px;
  top: 188px;
  width: 25px;
  height: 25px;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 10%;
  border-bottom-left-radius: 50% 40%;
  border-bottom-right-radius: 50% 40%;
  background-color: #c82b60;
  box-shadow: 1px -1px 1px 0 #6f1232;
  transform: rotate(32deg) scale(1.6, 1.6);
}

#petal1:before {
  content: "";
  position: absolute;
  height: 100%;
  width: 100%;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 10%;
  border-bottom-left-radius: 50% 40%;
  border-bottom-right-radius: 50% 40%;
  background-color: transparent;
  box-shadow: 0 0 10px 0 #e8b2ca;
  opacity: 0.9;
}

#petal1:after {
  content: "";
  position: absolute;
  height: 100%;
  width: 100%;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 10%;
  border-bottom-left-radius: 50% 40%;
  border-bottom-right-radius: 50% 40%;
  background-color: transparent;
  box-shadow: 0 0 35px 0 #e8b2ca;
  animation: glow 3s ease-in-out infinite;
}

#petal2 {
  position: absolute;
  left: 85px;
  top: 185px;
  width: 25px;
  height: 30px;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 50%;
  border-bottom-left-radius: 50% 50%;
  border-bottom-right-radius: 50% 10%;
  background-color: #d05478;
  transform: rotate(35deg) scale(1.2, 1);
  box-shadow: 1px -1px 1px 0 #6f1232;
  opacity: 0.9;
}

#petal3 {
  position: absolute;
  left: 105px;
  top: 197px;
  width: 25px;
  height: 28px;
  border-top-left-radius: 50% 50%;
  border-top-right-radius: 10% 10%;
  border-bottom-left-radius: 10% 10%;
  border-bottom-right-radius: 50% 50%;
  background-color: #cb5275;
  transform: rotate(25deg) scale(1, 1.05) skew(-8deg);
  box-shadow: 1px -1px 1px 0 #6f1232;
  opacity: 0.9;
}

#petal4 {
  position: absolute;
  left: 80px;
  top: 191px;
  width: 25px;
  height: 25px;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 50%;
  border-bottom-left-radius: 50% 50%;
  border-bottom-right-radius: 50% 10%;
  background-color: #d26484;
  transform: rotate(30deg) scale(1.1, 0.9) skew(10deg);
  box-shadow: 1px -1px 1px 0 #a53d60;
  opacity: 0.9;
}

#petal5 {
  position: absolute;
  left: 105px;
  top: 207px;
  width: 25px;
  height: 20px;
  border-top-left-radius: 50% 50%;
  border-top-right-radius: 10% 10%;
  border-bottom-left-radius: 10% 10%;
  border-bottom-right-radius: 50% 50%;
  background-color: #d26484;
  transform: rotate(28deg) scale(1, 1.05) skew(-18deg);
  box-shadow: 1px -1px 1px 0 #a53d60;
  opacity: 0.9;
}

#falling-petal {
  position: absolute;
  left: 105px;
  top: 209px;
  width: 22px;
  height: 18px;
  border-top-left-radius: 50% 50%;
  border-top-right-radius: 10% 10%;
  border-bottom-left-radius: 10% 10%;
  border-bottom-right-radius: 50% 50%;
  background-color: #da7290;
  transform: rotate(32deg) scale(0.9, 0.95) skew(-18deg);
  box-shadow: 1px -1px 1px 0 #a53d60;
  opacity: 0.9;
  animation: 7s fall 4s ease-in-out infinite;
}

#leaf1 {
  position: absolute;
  left: 75px;
  top: 225px;
  width: 13px;
  height: 20px;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 50%;
  border-bottom-left-radius: 50% 50%;
  border-bottom-right-radius: 50% 10%;
  background-color: #a1b965;
  transform: rotate(5deg);
}

#leaf2 {
  position: absolute;
  left: 82px;
  top: 265px;
  width: 12px;
  height: 16px;
  border-top-left-radius: 50% 10%;
  border-top-right-radius: 50% 50%;
  border-bottom-left-radius: 50% 50%;
  border-bottom-right-radius: 50% 10%;
  background-color: #a1b965;
  transform: rotate(-97deg);
}

/* ---------- Bui phep thuat ---------- */
.dustDef {
  position: absolute;
  background-color: white;
  border-radius: 100%;
  /* co the gay nhap nhay nhe luc dau (vd: firefox), nhung tao hieu ung mo dep mat */
  box-shadow: 0 0 3px 1px white;
  opacity: 0;
}

/* ---------- Canh (co gian theo man hinh de vua voi trai tim) ---------- */
#castle #scene {
  position: absolute;
  inset: 0;
  transform-origin: 50% 52%;
}

/* ---------- Loi chuc chay doc theo vien trai tim ---------- */
#heart-text {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
  overflow: visible;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 8px rgba(255, 79, 154, 0.45));
}

#heart-text text {
  font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
  font-weight: 600;
  fill: #ffa6d0;
  text-rendering: geometricPrecision;
}

#heart-text tspan {
  fill-opacity: 0;
  transition: fill-opacity 0.4s ease;
}

#heart-text tspan.show {
  fill-opacity: 1;
}

#heart-text.done text {
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { fill: #ffa6d0; }
  50%      { fill: #ffd0e6; }
}

/* ---------- Keyframes ---------- */
@keyframes hover {
  0%   { margin-top: 60px; }
  50%  { margin-top: 50px; }
  100% { margin-top: 60px; }
}

@keyframes glow {
  0%   { box-shadow: 0 0 25px 0 #e8b2ca; }
  50%  { box-shadow: 0 0 45px 0 #e8b2ca; }
  100% { box-shadow: 0 0 25px 0 #e8b2ca; }
}

@keyframes fall {
  5% {
    top: 209px;
    left: 105px;
    transform: rotate(55deg) scale(0.9, 0.95) skew(-18deg);
    opacity: 0.9;
  }
  30% {
    left: 90px;
  }
  55% {
    left: 130px;
  }
  60%, 100% {
    top: 380px;
    transform: rotate(30deg) scale(0.9, 0.95) skew(-32deg);
    opacity: 0;
  }
}

@keyframes floatAnimate {
  0% {
    background-size: 105% 120%;
    background-position: 0 0;
    opacity: .7;
  }
  50% {
    background-size: 100% 100%;
    background-position: 0 0;
    opacity: .5;
  }
  100% {
    background-size: 105% 120%;
    background-position: 0 0;
    opacity: .7;
  }
}
</style>
</head>
<body>

<div id="castle">
  <div id="scene">
  <div id="table"></div>

  <div class="shade-wrap hover-animation" id="main">
    <div id="flower-wrap">
      <div id="stem"></div>
      <div id="petal1"></div>
      <div id="petal2"></div>
      <div id="petal3"></div>
      <div id="petal4"></div>
      <div id="petal5"></div>
      <div id="falling-petal"></div>
      <div id="leaf1"></div>
      <div id="leaf2"></div>
    </div>
  </div>

  <div class="shade-wrap" id="sub">
    <div id="shade-main-reflections"></div>
    <div id="shade-main">
      <div id="shade-handle-big"></div>
      <div id="shade-handle-small"></div>
      <div id="top-reflection"></div>
      <div id="bottom-shade"></div>
    </div>
  </div>
  </div><!-- /scene -->
</div><!-- /castle -->

<svg id="heart-text" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>

<script>
(() => {

  const head = document.getElementsByTagName('head')[0];
  let animationId = 1;

  function CreateMagicDust(x1, x2, y1, y2, sizeRatio, fallingTime, animationDelay, node = 'main') {
    const dust = document.createElement('span');
    const animation = document.createElement('style');

    animation.innerHTML = `
      @keyframes blink${animationId} {
        0% {
          top: ${y1}px;
          left: ${x1}px;
          width: ${2 * sizeRatio}px;
          height: ${2 * sizeRatio}px;
          opacity: .4;
        }
        20% {
          width: ${4 * sizeRatio}px;
          height: ${4 * sizeRatio}px;
          opacity: .8;
        }
        35% {
          width: ${2 * sizeRatio}px;
          height: ${2 * sizeRatio}px;
          opacity: .5;
        }
        55% {
          width: ${3 * sizeRatio}px;
          height: ${3 * sizeRatio}px;
          opacity: .7;
        }
        80% {
          width: ${sizeRatio}px;
          height: ${sizeRatio}px;
          opacity: .3;
        }
        100% {
          top: ${y2}px;
          left: ${x2}px;
          width: 0px;
          height: 0px;
          opacity: .1;
        }
      }`;
    head.appendChild(animation);

    dust.classList.add('dustDef');
    dust.setAttribute(
      'style',
      `animation: blink${animationId++} ${fallingTime}s cubic-bezier(.71, .11, .68, .83) infinite ${animationDelay}s`
    );
    document.getElementById(node).appendChild(dust);
  }

  // Cac hat bui duoc dat thu cong de co hieu ung mong muon, co the doi thanh ngau nhien de dang
  [
    [130, 132, 150, 152, .15, 2.5, .1, 'sub'],
    [65, 63, 300, 299, .5, 2, .2, 'sub'],
    [70, 70, 150, 150, .45, 2, .5],
    [75, 78, 160, 170, .6, 2, 1],
    [80, 82, 160, 180, .6, 1, .4],
    [85, 100, 160, 170, .5, 2, .5],
    [125, 110, 170, 180, .25, 3, 1.5],
    [90, 90, 115, 115, .4, 2, 2],
    [93, 95, 200, 200, .4, 3, 1.5],
    [100, 100, 145, 155, .45, 1, .5],
    [100, 90, 170, 230, .35, 2, .75],
    [100, 102, 115, 112, .35, 3, .25],
    [100, 95, 170, 200, .55, 1.5, .75],
    [100, 97, 150, 190, .7, 2, 1.5],
    [105, 100, 160, 180, .5, 1.5, .725],
    [125, 125, 180, 190, .25, 1, .725],
    [130, 130, 135, 135, .45, 3, 1.5],
    [135, 132, 170, 190, .25, 2.5, .75],
    [135, 132, 320, 315, .2, 5, .3, 'sub']
  ].forEach((o) => CreateMagicDust(...o));

})();
</script>

<script>
/* Loi chuc chay tung chu doc theo vien trai tim, bao quanh bong hoa */
(() => {

  const message =
    'Chúc mừng ngày 20 tháng 10! Chúc em luôn xinh đẹp, rạng rỡ, mạnh khỏe và thật hạnh phúc. ' +
    'Cảm ơn em đã luôn ở bên cạnh anh. Anh yêu em ♥';

  const NS = 'http://www.w3.org/2000/svg';
  const XLINK = 'http://www.w3.org/1999/xlink';
  const svg = document.getElementById('heart-text');
  const scene = document.getElementById('scene');

  // Duong vien trai tim (toa do mau): diem M, roi 4 duong Bezier bac 3, bat dau tu cho lom tren dinh
  const HEART = [
    [0, 21.054],
    [0, 21.054], [24.618, -15.165], [60.75, 8.554],
    [93.249, 29.888], [57.749, 96.888], [0, 117.388],
    [-57.749, 96.888], [-93.249, 29.888], [-60.75, 8.554],
    [-24.618, -15.165], [0, 21.054], [0, 21.054]
  ];
  const BASE = 4.4;   // so px cho moi don vi toa do mau khi man hinh du rong

  function heartD(tx, ty, s) {
    const q = HEART.map((p) => (tx + p[0] * s).toFixed(2) + ',' + (ty + p[1] * s).toFixed(2));
    return 'M' + q[0] +
      ' C' + q[1] + ' ' + q[2] + ' ' + q[3] +
      ' C' + q[4] + ' ' + q[5] + ' ' + q[6] +
      ' C' + q[7] + ' ' + q[8] + ' ' + q[9] +
      ' C' + q[10] + ' ' + q[11] + ' ' + q[12] + 'z';
  }

  // Dung <defs><path> + <text><textPath> voi moi chu la mot <tspan> de hien dan
  const defs = document.createElementNS(NS, 'defs');
  const shape = document.createElementNS(NS, 'path');
  shape.id = 'shape';
  defs.appendChild(shape);
  svg.appendChild(defs);

  const textEl = document.createElementNS(NS, 'text');
  const textPath = document.createElementNS(NS, 'textPath');
  textPath.setAttribute('href', '#shape');
  textPath.setAttributeNS(XLINK, 'xlink:href', '#shape');
  const tspans = Array.from(message).map((ch) => {
    const t = document.createElementNS(NS, 'tspan');
    t.textContent = ch === ' ' ? ' ' : ch;
    textPath.appendChild(t);
    return t;
  });
  textEl.appendChild(textPath);
  svg.appendChild(textEl);

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;

    // He so co gian chung cho ca canh va trai tim (de luon nam gon trong man hinh)
    const k = Math.max(0.3, Math.min(1, (0.48 * vh - 30) / 308, vw / 700));
    const s = BASE * k;
    const sc = k * 0.88;   // thu nho canh mot chut de chao den va ban nam gon trong trai tim
    scene.style.transform = 'scale(' + sc + ')';

    // Dat trai tim sao cho tam chao den (khoang y = 46 trong toa do mau) trung tam chao
    const tx = vw / 2;
    const ty = vh * 0.52 - 6 * sc - 46 * s;
    shape.setAttribute('d', heartD(tx, ty, s));

    // Chon co chu de dong chu vua khit chu vi trai tim
    textEl.style.fontSize = '20px';
    textPath.removeAttribute('startOffset');
    const w20 = textEl.getComputedTextLength();
    const P = shape.getTotalLength();
    let f = 22;
    if (w20 > 0) f = 0.96 * P / (w20 / 20 + 1);
    f = Math.max(10, Math.min(30, f));
    textEl.style.fontSize = f + 'px';
    textPath.setAttribute('startOffset', f.toFixed(1));
  }

  layout();
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  // Hieu ung chay chu (bam vao man hinh de tam dung / tiep tuc / chay lai)
  const STEP = 85;      // ms moi chu
  const DELAY = 800;    // cho truoc khi bat dau
  let elapsed = -DELAY, shown = 0, last = null, rid = null;

  function frame(now) {
    if (last === null) last = now;
    elapsed += now - last;
    last = now;
    const target = Math.min(tspans.length, Math.max(0, Math.floor(elapsed / STEP) + 1));
    while (shown < target) tspans[shown++].classList.add('show');
    if (shown >= tspans.length) {
      svg.classList.add('done');
      rid = null;
      return;
    }
    rid = requestAnimationFrame(frame);
  }
  function start() { last = null; rid = requestAnimationFrame(frame); }

  document.addEventListener('click', () => {
    if (shown >= tspans.length) {
      tspans.forEach((t) => t.classList.remove('show'));
      svg.classList.remove('done');
      elapsed = -400;
      shown = 0;
      start();
    } else if (rid) {
      cancelAnimationFrame(rid);
      rid = null;
    } else {
      start();
    }
  });

  start();

})();
</script>

</body>
</html>
